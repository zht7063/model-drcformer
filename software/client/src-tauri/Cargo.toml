[package]
name = "drcformer-client"
version = "0.1.1"
description = "DRCFormer 弱监督语义分割桌面客户端"
edition = "2021"
rust-version = "1.82"

[lib]
name = "drcformer_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "multipart"] }
imagesize = "0.15"
base64 = "0.22"
